<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moo Money</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Moo Money</h1>
      <p>Collaborative household finance with secure bank sync.</p>

      <section class="card">
        <h2>Authentication</h2>
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <div class="row">
          <button id="registerBtn">Register</button>
          <button id="loginBtn">Login</button>
          <button id="logoutBtn">Logout</button>
        </div>
        <p id="authStatus">Not authenticated</p>
      </section>

      <section class="card">
        <h2>Bank Connection</h2>
        <button id="connectBankBtn" disabled>Connect Bank Account</button>
        <p id="bankStatus">Log in to create a Plaid Link token.</p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
